android {
    namespace 'net.jacoblo.randommp3alarm'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "net.jacoblo.randommp3alarm"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization
            minifyEnabled true

            // Enables resource shrinking (removes unused drawables, layouts, etc.)
            shrinkResources = true

            // Standard Android optimization rules + your custom rules
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )

            // Optional: If you don't need to debug the release build, this saves space
            // by removing debug metadata
            ndk {
                debugSymbolLevel = "NONE"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
}

